name: Gerar APK - Balcao Seguro

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  APP_VERSION: 1.2.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Ambiente (Node & Java)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild -p android --clean --non-interactive --no-install

      - name: Assinatura Temporaria
        run: |
          mkdir -p signing
          keytool -genkeypair -v -storetype PKCS12 -keystore signing/key.keystore -alias balcao -keyalg RSA -keysize 2048 -validity 10000 -storepass Balcao2026 -keypass Balcao2026 -dname "CN=Balcao"
          printf "storeFile=../signing/key.keystore\nstorePassword=Balcao2026\nkeyAlias=balcao\nkeyPassword=Balcao2026" > android/balcao-seguro-keystore.properties
          if [ -f "scripts/patch_android_signing.py" ]; then python3 scripts/patch_android_signing.py; fi

      - name: Compilar APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Balcao-Seguro-APK
          path: android/app/build/outputs/apk/release/*.apk
