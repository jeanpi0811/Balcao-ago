name: Gerar APK - Balcao Seguro (Resolvido)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostico e Localizacao
        id: locate
        run: |
          echo "--- ESTRUTURA ATUAL DO REPOSITORIO ---"
          find . -maxdepth 3 -not -path '*/.*'
          
          # Procura o package.json e define a pasta raiz do projeto
          PKG_PATH=<LaTex>(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)           if [ -z "</LaTex>PKG_PATH" ]; then
            echo "ERRO: package.json NAO ENCONTRADO! Verifique se voce subiu os arquivos corretamente."
            exit 1
          fi
          
          PROJ_DIR=<LaTex>(dirname "</LaTex>PKG_PATH")
          echo "Projeto encontrado em: <LaTex>PROJ_DIR"           echo "PROJ_DIR=</LaTex>PROJ_DIR" >> $GITHUB_ENV

      - name: Setup Node e Java
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar e Compilar
        run: |
          cd "${{ env.PROJ_DIR }}"
          
          # 1. Instala dependencias
          npm install --legacy-peer-deps
          
          # 2. Gera arquivos nativos
          npx expo prebuild -p android --clean --non-interactive --no-install
          
          # 3. Configura assinatura
          mkdir -p signing
          keytool -genkeypair -v -storetype PKCS12 -keystore signing/key.keystore -alias balcao -keyalg RSA -keysize 2048 -validity 10000 -storepass Balcao2026 -keypass Balcao2026 -dname "CN=Balcao"
          printf "storeFile=../signing/key.keystore\nstorePassword=Balcao2026\nkeyAlias=balcao\nkeyPassword=Balcao2026" > android/balcao-seguro-keystore.properties
          
          # 4. Gera o APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balcao-Seguro-APK
          path: "**/android/app/build/outputs/apk/release/*.apk"
