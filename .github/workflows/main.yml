name: Gerar APK - Diagnostico e Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  debug-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar Arquivos (Diagnostico)
        run: |
          echo "--- ESTRUTURA DO REPOSITORIO ---"
          find . -maxdepth 3 -not -path '*/.*'
          echo "--------------------------------"

      - name: Localizar package.json
        id: find_pkg
        run: |
          PKG_PATH=<LaTex>(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)           if [ -z "</LaTex>PKG_PATH" ]; then
            echo "ERRO CRITICO: package.json nao encontrado em lugar nenhum!"
            exit 1
          fi
          PROJECT_ROOT=<LaTex>(dirname "</LaTex>PKG_PATH")
          echo "ROOT=<LaTex>PROJECT_ROOT" >></LaTex>GITHUB_ENV
          echo "Projeto encontrado em: $PROJECT_ROOT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install e Build
        run: |
          cd ${{ env.ROOT }}
          npm install --legacy-peer-deps
          npx expo prebuild -p android --clean --non-interactive --no-install
          
          mkdir -p signing
          keytool -genkeypair -v -storetype PKCS12 -keystore signing/key.keystore -alias balcao -keyalg RSA -keysize 2048 -validity 10000 -storepass Balcao2026 -keypass Balcao2026 -dname "CN=Balcao"
          printf "storeFile=../signing/key.keystore\nstorePassword=Balcao2026\nkeyAlias=balcao\nkeyPassword=Balcao2026" > android/balcao-seguro-keystore.properties
          
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balcao-Seguro-APK
          path: "**/android/app/build/outputs/apk/release/*.apk"
